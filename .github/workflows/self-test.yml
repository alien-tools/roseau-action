name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck scripts/*.sh
      - run: python3 -m unittest discover -s tests -v

  no-breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        id: roseau
        with:
          baseline: org.apache.commons:commons-text:1.10.0
          current: org.apache.commons:commons-text:1.11.0
          reports: HTML=roseau-reports/report.html,CSV=roseau-reports/report.csv
          comment: false

      - name: Check outputs and reports
        env:
          HAS_BC: ${{ steps.roseau.outputs.has-breaking-changes }}
          COUNT: ${{ steps.roseau.outputs.breaking-change-count }}
          JSON_REPORT: ${{ steps.roseau.outputs.json-report }}
          MD_REPORT: ${{ steps.roseau.outputs.markdown-report }}
        run: |
          set -x
          [[ "$HAS_BC" == "false" ]]
          [[ "$COUNT" == "0" ]]
          [[ "$(jq 'length' "$JSON_REPORT")" == "0" ]]
          test -s "$MD_REPORT"
          test -s roseau-reports/report.html
          test -s roseau-reports/report.csv

  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        id: report-only
        with:
          baseline: org.apache.commons:commons-lang3:3.0
          current: org.apache.commons:commons-lang3:3.17.0
          fail-on-breaking-changes: false
          upload-reports: false
          comment: false

      - name: Check outputs
        env:
          HAS_BC: ${{ steps.report-only.outputs.has-breaking-changes }}
          COUNT: ${{ steps.report-only.outputs.breaking-change-count }}
          JSON_REPORT: ${{ steps.report-only.outputs.json-report }}
        run: |
          set -x
          [[ "$HAS_BC" == "true" ]]
          (( COUNT > 0 ))
          [[ "$(jq 'length' "$JSON_REPORT")" == "$COUNT" ]]

      - uses: ./
        id: failing
        continue-on-error: true
        with:
          baseline: org.apache.commons:commons-lang3:3.0
          current: org.apache.commons:commons-lang3:3.17.0
          report-dir: roseau-reports-failing
          upload-reports: false
          comment: false

      - name: Check that breaking changes fail the step
        env:
          OUTCOME: ${{ steps.failing.outcome }}
        run: '[[ "$OUTCOME" == "failure" ]]'

  invalid-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        id: invalid
        continue-on-error: true
        with:
          baseline: org.apache.commons:commons-text:1.10.0
          current: org.apache.commons:commons-text:1.11.0
          compatibility: bogus
          upload-reports: false
          comment: false

      - name: Check that invalid input fails the step
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: '[[ "$OUTCOME" == "failure" ]]'

  jar-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download JARs
        run: |
          base=https://repo1.maven.org/maven2/org/apache/commons/commons-lang3
          curl -sSfLo old.jar "$base/3.0/commons-lang3-3.0.jar"
          curl -sSfLo new.jar "$base/3.17.0/commons-lang3-3.17.0.jar"

      - uses: ./
        id: roseau
        with:
          baseline: old.jar
          current: new.jar
          compatibility: binary
          fail-on-breaking-changes: false
          upload-reports: false
          comment: false

      - name: Check outputs
        env:
          HAS_BC: ${{ steps.roseau.outputs.has-breaking-changes }}
          JSON_REPORT: ${{ steps.roseau.outputs.json-report }}
        run: |
          set -x
          [[ "$HAS_BC" == "true" ]]
          [[ "$(jq 'all(.binaryBreaking)' "$JSON_REPORT")" == "true" ]]

  # Runs the script directly, to simulate pull_request and push events in a library repository
  git-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Download Roseau
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          ROSEAU_VERSION: v0.7.0
        run: bash scripts/download-roseau.sh

      # v1 has c() at line 10. The pull request removes it; meanwhile, main moves it to line 12 and removes d().
      - name: Create a library repository
        id: lib
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git clone -q "$RUNNER_TEMP/origin.git" lib && cd lib
          mkdir -p src/main/java/p
          printf 'package p;\n\npublic class A {\n\tpublic void a() {}\n\n\tpublic void d() {}\n\n\tpublic void e() {}\n\n\tpublic void c() {}\n\n\tpublic void f() {}\n}\n' > src/main/java/p/A.java
          git add -A && git commit -qm v1 && git tag v1
          git checkout -qb feature && sed -i '/void c()/,+1d' src/main/java/p/A.java && git commit -qam "Remove c()"
          git checkout -q - && sed -i 's/^public class A {$/&\n\tpublic void x() {}\n\n\tpublic void y() {}\n/; /void d()/,+1d' src/main/java/p/A.java
          git commit -qam "Add x() and y(), remove d()" && git push -q origin HEAD feature v1
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse feature)" >> "$GITHUB_OUTPUT"

      - name: Compare a branch with a tag
        id: branch
        env:
          ROSEAU_JAR: ${{ steps.download.outputs.jar }}
          EVENT_NAME: push
          INPUT_BASELINE_REF: v1
          INPUT_CURRENT: lib/src/main/java
          INPUT_REPORT_DIR: branch-reports
        run: bash scripts/run-roseau.sh

      - name: Check that the branch is compared with the tag
        env:
          JSON_REPORT: ${{ steps.branch.outputs.json-report }}
          REPORT_DIR: ${{ steps.branch.outputs.report-dir }}
        run: |
          set -x
          [[ "$(jq -c 'map(.impactedSymbol)' "$JSON_REPORT")" == '["p.A.d()"]' ]]
          grep -q 'Baseline:\*\* `v1`' "$REPORT_DIR/comparison.md"

      # actions/checkout checks out the merge commit of the pull request
      - name: Compare a pull request whose base branch moved on
        id: pr
        env:
          ROSEAU_JAR: ${{ steps.download.outputs.jar }}
          EVENT_NAME: pull_request
          PR_BASE_SHA: ${{ steps.lib.outputs.base }}
          PR_HEAD_SHA: ${{ steps.lib.outputs.head }}
          INPUT_BASELINE_REF: v1
          INPUT_CURRENT: lib/src/main/java
          INPUT_REPORT_DIR: pr-reports
        run: |
          set -o pipefail
          git -C lib merge -q --no-edit feature
          bash scripts/run-roseau.sh | tee pr.log

      - name: Check that the head is compared with the merge base
        env:
          JSON_REPORT: ${{ steps.pr.outputs.json-report }}
          REPORT_DIR: ${{ steps.pr.outputs.report-dir }}
        run: |
          set -x
          [[ "$(jq -c 'map([.impactedSymbol, .location.line])' "$JSON_REPORT")" == '[["p.A.c()",10]]' ]]
          grep -q 'the merge base of this pull request' "$REPORT_DIR/comparison.md"
          grep -q "::notice::Pull requests are compared with their merge base" pr.log
          [[ "$(git -C lib rev-parse --is-shallow-repository)" == false ]]
