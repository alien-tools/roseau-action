name: "Roseau API Breaking Change Detection"
description: "Detect breaking changes between two versions of a Java library using Roseau"
author: "alien-tools"
branding:
  icon: shield
  color: orange

inputs:
  baseline:
    description: "Baseline version: Maven coordinates (g:a:v), local JAR, or source directory. Defaults to current at baseline-ref"
    required: false
  baseline-ref:
    description: "Git ref (tag, branch, or SHA) at which current is the baseline. Defaults to the PR base commit on pull_request events, and to the previous commit on push events"
    required: false
  current:
    description: "Current version: Maven coordinates (g:a:v), local JAR, or source directory"
    required: true
  fail-on-breaking-changes:
    description: "Fail the step if breaking changes are found"
    required: false
    default: "true"
  compatibility:
    description: "Compatibility mode to check: all, binary, or source"
    required: false
    default: "all"
  ignored:
    description: "Path to a CSV file listing accepted breaking changes"
    required: false
  config:
    description: "Path to a roseau.yaml configuration file"
    required: false
  classpath:
    description: "Extra classpath JARs shared by both versions"
    required: false
  v1-classpath:
    description: "Extra classpath JARs for the baseline version"
    required: false
  v2-classpath:
    description: "Extra classpath JARs for the current version"
    required: false
  pom:
    description: "POM used to extract a shared classpath; read from each version when comparing with a git ref"
    required: false
  v1-pom:
    description: "POM used to extract the baseline classpath"
    required: false
  v2-pom:
    description: "POM used to extract the current classpath"
    required: false
  reports:
    description: "Comma-separated FORMAT=PATH pairs for additional reports (e.g. HTML=report.html,CSV=report.csv)"
    required: false
  report-dir:
    description: "Directory where default reports are written"
    required: false
    default: "roseau-reports"
  upload-reports:
    description: "Upload generated reports as a workflow artifact"
    required: false
    default: "true"
  comment:
    description: "Post/update a PR comment with the breaking changes report"
    required: false
    default: "true"
  inline-comments:
    description: "Comment each breaking change on the lines of the PR diff; requires comment"
    required: false
    default: "true"
  annotations:
    description: "Annotate breaking changes on the lines of the PR diff: auto (only those without an inline comment), true, or false"
    required: false
    default: "auto"
  java-version:
    description: "JDK version to set up"
    required: false
    default: "25"
  roseau-version:
    description: "Roseau release version (e.g. v0.6.0), or 'latest'"
    required: false
    default: "latest"

outputs:
  has-breaking-changes:
    description: "'true' if breaking changes were detected, 'false' otherwise"
    value: ${{ steps.analyze.outputs.has-breaking-changes }}
  breaking-change-count:
    description: "Number of breaking changes detected"
    value: ${{ steps.analyze.outputs.breaking-change-count }}
  report-dir:
    description: "Directory containing generated reports"
    value: ${{ steps.analyze.outputs.report-dir }}
  json-report:
    description: "Path to the generated JSON report"
    value: ${{ steps.analyze.outputs.json-report }}
  markdown-report:
    description: "Path to the generated Markdown report"
    value: ${{ steps.analyze.outputs.markdown-report }}

runs:
  using: "composite"
  steps:
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Download Roseau
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ROSEAU_VERSION: ${{ inputs.roseau-version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/download-roseau.sh"

    - name: Run Roseau
      id: analyze
      shell: bash
      env:
        ROSEAU_JAR: ${{ steps.download.outputs.jar }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_BASELINE_REF: ${{ inputs.baseline-ref }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        INPUT_CURRENT: ${{ inputs.current }}
        INPUT_FAIL_ON_BREAKING_CHANGES: ${{ inputs.fail-on-breaking-changes }}
        INPUT_COMPATIBILITY: ${{ inputs.compatibility }}
        INPUT_IGNORED: ${{ inputs.ignored }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_CLASSPATH: ${{ inputs.classpath }}
        INPUT_V1_CLASSPATH: ${{ inputs.v1-classpath }}
        INPUT_V2_CLASSPATH: ${{ inputs.v2-classpath }}
        INPUT_POM: ${{ inputs.pom }}
        INPUT_V1_POM: ${{ inputs.v1-pom }}
        INPUT_V2_POM: ${{ inputs.v2-pom }}
        INPUT_REPORTS: ${{ inputs.reports }}
        INPUT_REPORT_DIR: ${{ inputs.report-dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-roseau.sh"

    - name: Upload reports
      if: >-
        always()
        && inputs.upload-reports == 'true'
        && steps.analyze.outputs.report-dir != ''
      uses: actions/upload-artifact@v7
      with:
        name: roseau-reports
        path: ${{ steps.analyze.outputs.report-dir }}
        if-no-files-found: error

    - name: Annotate breaking changes
      if: >-
        always()
        && github.event_name == 'pull_request'
        && steps.analyze.outputs.report-dir != ''
        && (inputs.annotations != 'false' || (inputs.comment == 'true' && inputs.inline-comments == 'true'))
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        JSON_REPORT: ${{ steps.analyze.outputs.json-report }}
        REPORT_DIR: ${{ steps.analyze.outputs.report-dir }}
        LEVEL: ${{ steps.analyze.outputs.fail-on-breaking-changes == 'true' && 'error' || 'warning' }}
        ANNOTATIONS: ${{ inputs.annotations }}
        INLINE_COMMENTS: ${{ inputs.comment == 'true' && inputs.inline-comments == 'true' && '--inline-comments' || '--no-inline-comments' }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/scripts/annotate.py"
        --report "$JSON_REPORT" --summary "$REPORT_DIR/inline.md" --level "$LEVEL"
        --annotations "$ANNOTATIONS" "$INLINE_COMMENTS"

    - name: Job summary
      if: always() && steps.analyze.outputs.report-dir != ''
      shell: bash
      env:
        REPORT_DIR: ${{ steps.analyze.outputs.report-dir }}
        HAS_BREAKING_CHANGES: ${{ steps.analyze.outputs.has-breaking-changes }}
      run: bash "$GITHUB_ACTION_PATH/scripts/write-summary.sh"

    - name: PR comment
      if: >-
        always()
        && inputs.comment == 'true'
        && github.event_name == 'pull_request'
        && steps.analyze.outputs.report-dir != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPORT_DIR: ${{ steps.analyze.outputs.report-dir }}
        HAS_BREAKING_CHANGES: ${{ steps.analyze.outputs.has-breaking-changes }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "$GITHUB_ACTION_PATH/scripts/comment-pr.sh"

    - name: Report breaking changes
      if: always() && steps.analyze.outputs.has-breaking-changes == 'true'
      shell: bash
      env:
        COUNT: ${{ steps.analyze.outputs.breaking-change-count }}
        BASELINE: ${{ steps.analyze.outputs.baseline-description }}
        FAIL: ${{ steps.analyze.outputs.fail-on-breaking-changes }}
      run: |
        message="Roseau detected $COUNT breaking change(s) since $BASELINE"
        if [[ "$FAIL" == "true" ]]; then
          echo "::error title=Breaking changes::$message"
          exit 1
        fi
        echo "::warning title=Breaking changes::$message"
